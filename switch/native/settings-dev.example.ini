# Developer options of SwitchWaker on the Switch: an example of the [dev] section of the settings
# file, sdmc:/switch/switchwaker/native/user/settings.ini (on the Mac and Linux: user/settings.ini
# next to the executable, or COS_SETTINGS=<path>; the process environment works there too and wins).
# Players need none of this: everything a player may want is in the in-game options menu (Minus).
#
# The file: the options menu writes its values first, one NAME=value line each (NAME@handheld= /
# NAME@docked= for the rows with a value per mode). A line "[dev]" starts the developer section,
# which runs to the end of the file: NAME=value lines of variables that have no row in the menu,
# set in the environment when the game starts (a change applies at the next start). Lines starting
# with # are comments. The menu writes the [dev] section back exactly as it is, so it survives every
# change made in the menu. A menu setting in [dev] is ignored (the log says so): change it in the
# menu, or, for a value the menu does not offer, as a line of the first part (e.g.
# COS_DYNRES=fixed:1.125). The log lists what [dev] set: "[cos] settings: [dev] NAME=value".
# The comments of the first part (these ones) give way to the menu's own header at its first save.
#
# Edit it on the SD card, or over the debug server (docs/DEBUG_SERVER.md):
#   scripts/switch/switchwaker_debug.py get native/user/settings.ini settings.ini
#   (edit, then) scripts/switch/switchwaker_debug.py put settings.ini native/user/settings.ini
#   scripts/switch/switchwaker_debug.py reload
#
# Rows of the menu's Depuración tab that used to be env.txt lines: perf lines (COS_PERF_EVERY),
# hitch lines (COS_HITCH_MS), HD texture stats (COS_HD_STATS_EVERY), the USB live log (COS_USB_LOG),
# the debug server (COS_DEBUG_SERVER), GPU timers per group (COS_GPU_GROUPS); Rendimiento: the FPS
# panel (COS_FPS_OVERLAY) and the shader preloading (COS_PRECOMPILE, COS_PRECOMPILE_SCREEN).
#
# The native/env.txt of earlier builds is moved into this file at the first start of a newer build
# (menu settings as such, the rest into [dev]) and kept as native/env.txt.old.
#
# Any COS_* variable of native/README.md ("Running switchwaker") works in [dev]. Remove the # in front
# of one of these to use it:

[dev]
# Exit 0 when the title's sea is reached (milestone M7, "opening"):
#COS_MILESTONE=opening
#
# Exit 0 after this many game frames:
#COS_FRAMES=1800
#
# Log every scene the game creates:
#COS_TRACE=scene
#
# Start-up check only: every static constructor ran and the 502 actor profiles are in place:
#COS_SMOKE=static-init
#
# Write through a null pointer, to check the crash report ("[cos] CRASH" in the log, then
# Atmosphère ends the app with its own report):
#COS_SMOKE=crash-test
#
# Boot straight into a stage (stage:room:point), e.g. Outset's shore for the foam check
# (COS_SMOKE=shore-foam):
#COS_BOOT_STAGE=sea:44:8
#
# Do not start JAudio and the DSP:
#COS_AUDIO=off
#
# Journal of Aurora's sqlite caches (user/cache/dawn_cache_dk.db, pipeline_cache.db; docs/SWITCH_BUILD.md,
# the paragraph on Aurora's caches before "Pipeline precompile"): persist (default; a game closed
# with HOME mid-write is rolled back at the next start), truncate, delete, or memory (no journal
# file; a kill mid-write can damage the cache, which is then deleted and rebuilt):
#COS_SWITCH_SQLITE_JOURNAL=memory
#
# Share of the time the boot warm-up may build pipelines behind the logos and menus (boot, after the
# loading screen; default 0.5). 1 or 0: back to back (faster warm-up, a choppier picture meanwhile):
#COS_PRECOMPILE_DUTY=0.3
#
# Only a warm-up build slower than this many ms (a shader the DKSH cache lacks, compiled on the
# console) makes the next one wait for the duty above; faster builds (cache hits) follow at once
# (default 25; 0: every build waits). It also decides the automatic loading screen:
#COS_PRECOMPILE_SLOW_MS=25
#
# The automatic loading screen shows only when the slow work left would take more than this many
# seconds (default 3); less is built behind the logos:
#COS_PRECOMPILE_SCREEN_MIN_S=3
#
# Frame rate cap of the "Preparing shaders" loading screen (default 10):
#COS_PRECOMPILE_SCREEN_FPS=10
#
# No "[cos] precompile" progress lines:
#COS_PRECOMPILE_LOG=0
#
# Language of the loading screen and the options menu (default: the console's; es = Spanish,
# anything else English):
#COS_LANG=es
#
# HD textures (docs/HD_TEXTURES.md; the menu's "Texturas HD" turns them on): GPU memory the pack may
# use (default 512 MiB on the Switch):
#COS_HD_BUDGET_MB=512
#
# The deko3d renderer (docs/DEKO3D_MIGRATION_PLAN.md):
# The phase 2 test pattern instead of the game:
#COS_DK_TEST_PATTERN=1
#
# Conventions (logged at start as "[dk] conventions:"), to fix the picture's orientation without a
# rebuild: clip-space y negated, front face inverted, textures uploaded bottom row first, the
# picture flipped at the present:
#COS_DK_FLIP_Y=1
#COS_DK_FLIP_FRONT=1
#COS_DK_FLIP_TEXTURE=1
#COS_DK_FLIP_PRESENT=1
#
# Compiled shaders copied into code memory per frame (default 64; 0 = no limit):
#COS_DK_SHADER_BUDGET=64
#
# Commands sent to the GPU every this many draws (default 256; 0 = once per frame):
#COS_DK_SUBMIT_DRAWS=256
#
# GPU timestamps per pass (default on), zcull (default off), compressed colour targets (default
# off), dual-source blending for destination alpha (default off):
#COS_DK_GPU_TIMERS=0
#COS_DK_ZCULL=1
#COS_DK_COMPRESSION=1
#COS_DK_DUAL_SOURCE=1
#
# deko3d diagnostics (off by default; module hashes are the 16 hex digits the log prints):
# every GX draw of frame N logged, one line each (module, blend, depth, the bound textures):
#COS_DK_TRACE_FRAME=1800
# the draws of these modules not drawn:
#COS_DK_SKIP_MODULE=bce2e9e4d21e9f6a,0123456789abcdef
# before the draws of that module (from COS_DK_TRACE_FRAME on), the pass's colour target (up to 16
# files) or depth buffer written raw to sdmc:/switch/switchwaker/native/trace_*.raw:
#COS_DK_DUMP_COLOR=bce2e9e4d21e9f6a
#COS_DK_DUMP_DEPTH=bce2e9e4d21e9f6a
# that module's WGSL rewritten before it is compiled ("<module>:<find>=><replace>|<find>=><replace>"):
#COS_DK_WGSL_PATCH=bce2e9e4d21e9f6a:return out;=>out.color = vec4f(1.0); return out;
# uam's scheduling words patched at load: 1 no dual issue, 2 + wait on every scoreboard, 3 + stall
# 15 (slow); a fault that 2 or 3 fixes is a uam scheduling bug (uam patch 8 was found this way):
#COS_DK_SHADER_SCHED=2
#
# 60 presents a second, step A of docs/FPS60_PLAN.md (measurement only, no menu row): each game
# frame of two retraces is presented twice, paint A at once and paint B (the frame's new draw lists
# painted again, no second draw pass) at its end; each paint waits one retrace, the game keeps its
# speed. Not with the options menu open. The perf lines (COS_PERF_EVERY) then end with "fps60:
# painter2 <paint B ms>, split <paint A's present ms>, <n> presents/s":
#COS_FPS60_TEST=1
# with it Aurora's GX worker ends each frame itself (aurora_end_frame does not wait for it to drain
# the frame; at most one frame ahead): on by default with COS_FPS60_TEST, 0 turns it off (or 1 on
# without it). The fps60 part of the perf lines then also gives "drawdone" (the draw pass's
# GXDrawDone wait for the worker) and "end_frame calls" (the aurora_end_frame calls, async or sync):
#COS_ASYNC_END_FRAME=0
# step B: paint B shows the camera halfway between the last two game frames' (on with
# COS_FPS60_TEST); 0 turns it off, COS_FPS60_CAMERA_T sets the blend (0.5; 0 = the previous camera).
# The perf lines then give "camera blended <n> cuts <n>" and "paint B dropped <n>" (frames presented
# once: a scene change, fade, wipe or load in progress; COS_FPS60_GATE=0 paints B even then):
#COS_FPS60_CAMERA=0
#COS_FPS60_CAMERA_T=0.5
#COS_FPS60_GATE=0
#
# The CPU clock for a measurement (back to the stock 1020 MHz when the game ends), e.g. 1224 MHz:
#COS_SWITCH_CPU_HZ=1224000000
#
# Paint B purity check (macOS only; with COS_FPS60_TEST=1): what paint B changes in the game's
# globals (1) or also its heaps (2), logged by symbol; _REPEAT=1 paints B twice and reports only
# what the second paint changes again (counters and state machines, not plain writes); _TRAP=1 logs
# the code of the first write to each change found (a watchpoint); _IGNORE=a,b leaves out symbols:
#COS_PAINT_PURITY=1
#COS_PAINT_PURITY_REPEAT=1
#COS_PAINT_PURITY_TRAP=1
#COS_PAINT_PURITY_IGNORE=JASystem,JKRDvd
